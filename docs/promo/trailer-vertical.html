<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Palasyo Vertical Trailer</title>
<style>
  :root { --gold: #d6b25e; --night: #050b11; --text: #efe6d0; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--night); color: var(--text); font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  canvas { height: min(80vh, 1280px); max-width: 100%; aspect-ratio: 9 / 16; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.6); background: #000; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button { font: 600 14px system-ui; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--gold); background: transparent; color: var(--gold); cursor: pointer; }
  button.primary { background: var(--gold); color: #1f1a12; }
  button:disabled { opacity: .4; cursor: default; }
  #status { color: rgba(239,230,208,.65); font-size: 13px; min-height: 18px; text-align: center; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="bar">
  <button id="play" class="primary">▶ Play</button>
  <button id="rec">⏺ Record &amp; download video</button>
</div>
<div id="status">TikTok / Reels / Shorts · 1080×1920 · 30 seconds · music &amp; sound effects</div>
<script>
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const W = 1080, H = 1920, DURATION = 30;
const SERIF = 'Georgia, "Times New Roman", serif';
const SANS = '"Arial Black", "Segoe UI", system-ui, sans-serif';
const GOLD = '#d6b25e', PAPER = '#f1e7cf', INK = '#1f1a12', RED = '#e0453a', YEL = '#ffd23f';
// Key content stays above y≈1500 (TikTok's caption area) and left of x≈940 (its buttons).

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (t) => 1 - Math.pow(1 - clamp(t), 3);
const back = (t) => { t = clamp(t); const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
let shake = 0;

function text(str, x, y, { size = 60, font = SERIF, color = '#fff', align = 'center', alpha = 1, weight = '700', stroke = 0, spacing = 0 } = {}) {
  g.save(); g.globalAlpha = clamp(alpha); g.textAlign = align; g.textBaseline = 'middle';
  g.font = `${weight} ${size}px ${font}`;
  if (spacing) g.letterSpacing = spacing + 'px';
  if (stroke) { g.lineJoin = 'round'; g.lineWidth = stroke; g.strokeStyle = '#000'; g.strokeText(str, x, y); }
  else { g.shadowColor = 'rgba(0,0,0,.7)'; g.shadowBlur = 14; }
  g.fillStyle = color; g.fillText(str, x, y); g.restore();
}
// TikTok-style caption: chunky white text with black outline, one word highlighted in yellow.
function caption(words, y, t, size = 92) {
  const k = back(t / 0.3);
  g.save(); g.translate(W / 2, y); g.scale(k, k);
  g.font = `900 ${size}px ${SANS}`;
  const parts = words.map((w) => (typeof w === 'string' ? { w, hi: false } : { w: w[0], hi: true }));
  const total = parts.reduce((n, p) => n + g.measureText(p.w + ' ').width, 0);
  const fit = Math.min(1, (W - 140) / total); // shrink long lines to stay inside the frame
  g.scale(fit, fit);
  let x = -total / 2;
  for (const p of parts) {
    const wd = g.measureText(p.w + ' ').width;
    text(p.w, x + g.measureText(p.w).width / 2, 0, { size, font: SANS, weight: '900', stroke: 14, color: p.hi ? YEL : '#fff', alpha: clamp(t / 0.12) });
    x += wd;
  }
  g.restore();
}
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function flash(t, color = '255,255,255') { if (t < 0.15) { g.fillStyle = `rgba(${color},${0.8 * (1 - t / 0.15)})`; g.fillRect(0, 0, W, H); } }

const stars = Array.from({ length: 200 }, () => [Math.random() * W, Math.random() * H, Math.random()]);
function bg(t, tint = '#0d1824', zoom = 1) {
  const grd = g.createRadialGradient(W / 2, H * 0.42, 60, W / 2, H / 2, H * 0.7 * zoom);
  grd.addColorStop(0, tint); grd.addColorStop(1, '#03070b');
  g.fillStyle = grd; g.fillRect(-50, -50, W + 100, H + 100);
  for (const [x, y, s] of stars) { g.fillStyle = `rgba(239,230,208,${0.1 + 0.3 * Math.abs(Math.sin(t * s * 2 + x))})`; g.fillRect(x, y, 2, 2); }
}
function vignette() {
  const v = g.createRadialGradient(W / 2, H / 2, W * 0.35, W / 2, H / 2, H * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.75)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}
// Progress bar along the top keeps people watching to the end.
function progress(time) { g.fillStyle = 'rgba(255,255,255,.15)'; g.fillRect(0, 0, W, 8); g.fillStyle = YEL; g.fillRect(0, 0, W * time / DURATION, 8); }

// ── scenes ──
const SCENES = [
  // 1. HOOK: an urgent text from a stranger
  [0, 3, (t) => {
    bg(t, '#1a0f14');
    const y = 520 + (1 - back(t / 0.4)) * -300;
    g.save(); rrect(90, y, 900, 250, 36); g.fillStyle = 'rgba(30,34,42,.95)'; g.fill(); g.restore();
    text('💬  MESSAGES · now', 140, y + 55, { size: 30, font: 'system-ui', weight: '600', align: 'left', color: 'rgba(255,255,255,.6)' });
    text('Unknown number', 140, y + 115, { size: 44, font: 'system-ui', weight: '800', align: 'left' });
    text('“Mr. President, we need to talk.', 140, y + 175, { size: 36, font: 'system-ui', weight: '400', align: 'left', color: 'rgba(255,255,255,.85)' });
    text('Don’t tell your Cabinet.”', 140, y + 220, { size: 36, font: 'system-ui', weight: '400', align: 'left', color: 'rgba(255,255,255,.85)' });
    if (t > 0.9) caption(['Kaya', 'mo', 'bang', 'maging'], 1050, t - 0.9);
    if (t > 1.3) caption([['PRESIDENTE?']], 1170, t - 1.3, 120);
  }],
  // 2. Stakes
  [3, 6, (t) => {
    bg(t, '#101a2a');
    caption(['You', 'have', ['6', 'YEARS.']], 640, t, 100);
    if (t > 0.8) caption(['110', 'million', 'people.'], 790, t - 0.8, 90);
    if (t > 1.6) caption(['One', ['mistake...']], 1000, t - 1.6, 110);
    if (t > 1.6) shake = Math.max(shake, 1 - (t - 1.6) * 3);
  }],
  // 3. Headline slam
  [6, 9, (t) => {
    bg(t, '#1a1208');
    const rot = (1 - ease(t / 0.35)) * 0.6 - 0.05, sc = 2.5 - 1.5 * ease(t / 0.35);
    g.save(); g.translate(W / 2, 820); g.rotate(rot); g.scale(sc, sc);
    rrect(-420, -360, 840, 720, 6); g.fillStyle = PAPER; g.fill();
    text('THE KAPULUAN DAILY', 0, -300, { size: 34, color: INK, font: SERIF, spacing: 4 });
    g.fillStyle = INK; g.fillRect(-380, -265, 760, 4);
    text('PRESIDENT', 0, -170, { size: 110, color: INK, font: SERIF, weight: '900' });
    text('IMPEACHED', 0, -50, { size: 110, color: '#a01d24', font: SERIF, weight: '900' });
    g.fillStyle = 'rgba(31,26,18,.12)'; for (let i = 0; i < 9; i++) g.fillRect(-380, 40 + i * 32, i % 3 === 2 ? 480 : 760, 14);
    g.restore();
    if (t > 0.35 && t < 0.5) shake = 1;
    flash(t - 0.35);
    if (t > 1) caption(['Every', 'choice', 'is', ['remembered.']], 1380, t - 1, 80);
  }],
  // 4. Real decision with a ticking clock
  [9, 14, (t) => {
    bg(t, '#0d1824');
    const x = 70, y = 300 + (1 - ease(t / 0.4)) * 200;
    g.save(); g.globalAlpha = ease(t / 0.3); rrect(x, y, 940, 1060, 26); g.fillStyle = PAPER; g.fill();
    g.fillStyle = '#c0392b'; rrect(x + 50, y + 50, 300, 56, 10); g.fill(); g.restore();
    text('🌀 TYPHOON', x + 200, y + 79, { size: 28, font: 'system-ui', color: '#fff', weight: '800', spacing: 2 });
    const secs = Math.max(0, 10 - Math.floor(t * 2));
    text('⏱ ' + secs, x + 840, y + 79, { size: 40, font: 'system-ui', color: secs < 4 ? '#c0392b' : INK, weight: '900', align: 'right' });
    text('Visara is', x + 50, y + 190, { size: 80, color: INK, align: 'left' });
    text('under water.', x + 50, y + 280, { size: 80, color: INK, align: 'left' });
    text('Treasury: ₱110B. Not enough.', x + 50, y + 370, { size: 38, color: '#7a2a20', align: 'left', font: 'system-ui', weight: '700' });
    const choices = [['💸  Borrow and spend it all', 'Debt ▲  Approval ▲'], ['🪖  Send in the military', 'Military ▲  Critics ▲'], ['🤝  Accept Haizhou’s aid', 'Sovereignty ▼']];
    const picked = t > 3.4 ? 2 : -1;
    choices.forEach(([c, h], i) => {
      const ca = clamp((t - 0.6 - i * 0.3) / 0.25), cy = y + 450 + i * 190, off = (1 - back((t - 0.6 - i * 0.3) / 0.35)) * 400;
      g.save(); g.globalAlpha = ca; g.translate(off, 0); rrect(x + 50, cy, 840, 160, 18);
      g.fillStyle = picked === i ? YEL : 'rgba(31,26,18,0.07)'; g.fill();
      g.strokeStyle = picked === i ? '#000' : 'rgba(31,26,18,0.25)'; g.lineWidth = 4; g.stroke();
      text(c, x + 85, cy + 60, { size: 42, color: INK, align: 'left', font: 'system-ui', weight: '800' });
      text(h, x + 85, cy + 115, { size: 30, color: '#6b5d45', align: 'left', font: 'system-ui', weight: '600' });
      g.restore();
    });
    if (t > 3.2 && t < 4) { g.fillStyle = `rgba(255,210,63,${0.7 * (1 - (t - 3.2) / 0.8)})`; g.beginPath(); g.arc(x + 760, y + 450 + 2 * 190 + 80, 30 + (t - 3.2) * 120, 0, 7); g.fill(); }
    if (t > 3.6) caption(['Bad', ['idea.']], 1450, t - 3.6, 110);
  }],
  // 5. Consequences cascade
  [14, 19, (t) => {
    bg(t, '#1d0909');
    const k = ease(t / 2.4);
    text('3 MONTHS LATER', W / 2, 250, { size: 40, font: 'system-ui', weight: '800', color: 'rgba(255,255,255,.6)', spacing: 8 });
    const rows = [['Approval', (64 - 33 * k).toFixed(0) + '%'], ['Inflation', (3.1 + 6.4 * k).toFixed(1) + '%'], ['Peso', '₱' + (56 + 11 * k).toFixed(2)], ['Senate votes to remove you', String(Math.round(16 * k)) + ' / 24']];
    rows.forEach(([l, v], i) => {
      const y = 400 + i * 220, a = clamp((t - 0.2 - i * 0.25) / 0.25);
      g.save(); g.globalAlpha = a; rrect(80, y, 920, 180, 22); g.fillStyle = i === 3 ? 'rgba(224,69,58,.25)' : 'rgba(255,255,255,0.06)'; g.fill(); g.strokeStyle = i === 3 ? RED : 'rgba(255,255,255,.15)'; g.lineWidth = 3; g.stroke(); g.restore();
      text(l, 130, y + 90, { size: i === 3 ? 38 : 46, align: 'left', font: 'system-ui', weight: '700', alpha: a });
      text(v, 950, y + 90, { size: 74, align: 'right', color: RED, alpha: a });
    });
    // crowd silhouettes rising
    const rise = ease((t - 1.5) / 1.5) * 260;
    g.fillStyle = '#000';
    for (let i = 0; i < 26; i++) { const x = i * 44, hh = 120 + ((i * 37) % 60); g.beginPath(); g.arc(x, H - rise - hh + 300 + 20, 22, 0, 7); g.fill(); g.fillRect(x - 24, H - rise - hh + 340, 48, 400); }
    if (t > 2.8) caption(['The', 'people', 'are', ['coming.']], 1340, t - 2.8, 96);
    if (t > 2.8) shake = Math.max(shake, 0.4);
  }],
  // 6. Scale of the game
  [19, 24, (t) => {
    bg(t, '#0d1824');
    const items = [['900+', 'story events'], ['15', 'different endings'], ['∞', 'consequences']];
    items.forEach(([n, l], i) => {
      const tt = t - i * 0.8; if (tt < 0) return;
      const y = 520 + i * 330;
      g.save(); g.translate(W / 2, y); g.scale(back(tt / 0.35), back(tt / 0.35));
      text(n, 0, -40, { size: 180, font: SANS, weight: '900', color: YEL, stroke: 16 });
      text(l, 0, 95, { size: 56, font: SANS, weight: '900', stroke: 10 });
      g.restore();
      flash(tt, '255,210,63');
    });
    if (t > 3) caption(['Congress.', 'Courts.', ['Family.']], 1500, t - 3, 80);
  }],
  // 7. Endings tease
  [24, 27, (t) => {
    bg(t, '#140d10');
    caption(['How', 'will', 'YOUR', 'story', ['end?']], 300, t, 84);
    const ends = [['🌅', 'Ama ng Bayan', '#c9932c'], ['⛓️', 'Prison', '#4a4a52'], ['✈️', 'Exile', '#3d6a8f'], ['🚁', 'Overthrown', '#8f1f25'], ['🏛️', 'Senator', '#2f5fa7'], ['🪖', 'Dictator', '#4b5320']];
    ends.forEach(([icon, name, c], i) => {
      const tt = t - 0.3 - i * 0.18, x = 90 + (i % 2) * 470, y = 470 + Math.floor(i / 2) * 330;
      if (tt < 0) return;
      g.save(); g.translate(x + 215, y + 140); g.scale(back(tt / 0.3), back(tt / 0.3)); rrect(-215, -140, 430, 290, 24); g.fillStyle = c; g.fill();
      text(icon, 0, -30, { size: 100, font: 'system-ui' }); text(name, 0, 85, { size: 46, font: 'system-ui', weight: '900' }); g.restore();
    });
  }],
  // 8. CTA
  [27, 30, (t) => {
    bg(t, '#0d1824', 1.2);
    flash(t, '214,178,94');
    g.save(); g.translate(W / 2, 680); g.scale(back(t / 0.4), back(t / 0.4));
    text('PALASYO', 0, 0, { size: 190, color: GOLD, font: SERIF, weight: '900', spacing: 10 });
    g.restore();
    text('A Political Story', W / 2, 850, { size: 64, alpha: (t - 0.3) / 0.3, weight: '400' });
    const pulse = 1 + Math.sin(t * 8) * 0.03;
    g.save(); g.globalAlpha = clamp((t - 0.6) / 0.3); g.translate(W / 2, 1100); g.scale(pulse, pulse);
    rrect(-360, -75, 720, 150, 75); g.fillStyle = YEL; g.fill();
    text('PLAY FREE NOW ▶', 0, 0, { size: 54, color: '#000', font: SANS, weight: '900' }); g.restore();
    if (t > 1.1) caption(['Comment', 'your', ['ending', '👇']], 1340, t - 1.1, 76);
  }],
];

let lastScene = -1;
function draw(time, sfx = false) {
  const idx = Math.max(0, SCENES.findIndex(([a, b]) => time >= a && time < b));
  const scene = SCENES[idx === -1 ? SCENES.length - 1 : idx];
  if (sfx && idx !== lastScene) { whoosh(); if (idx === 2) impact(); if (idx === 0) buzz(); if (idx === 4) rumble(); }
  lastScene = idx;
  g.save();
  if (shake > 0) { g.translate((Math.random() - 0.5) * 40 * shake, (Math.random() - 0.5) * 40 * shake); shake = Math.max(0, shake - 0.08); }
  scene[2](time - scene[0]);
  g.restore();
  vignette();
  progress(time);
}

// ── audio ──
let actx = null, bus = null;
function out() { return bus; }
function noise(sec) { const b = actx.createBuffer(1, actx.sampleRate * sec, actx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; const s = actx.createBufferSource(); s.buffer = b; return s; }
function whoosh() { if (!actx) return; const n = noise(0.5), f = actx.createBiquadFilter(), gn = actx.createGain(), t = actx.currentTime; f.type = 'bandpass'; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(4000, t + 0.35); gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(0.35, t + 0.2); gn.gain.linearRampToValueAtTime(0.0001, t + 0.45); n.connect(f).connect(gn).connect(out()); n.start(t); }
function impact() { if (!actx) return; const t = actx.currentTime + 0.35, o = actx.createOscillator(), gn = actx.createGain(); o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.8); gn.gain.setValueAtTime(1, t); gn.gain.exponentialRampToValueAtTime(0.001, t + 1); o.connect(gn).connect(out()); o.start(t); o.stop(t + 1); }
function buzz() { if (!actx) return; for (const d of [0, 0.3]) { const t = actx.currentTime + d, o = actx.createOscillator(), gn = actx.createGain(); o.type = 'square'; o.frequency.value = 150; gn.gain.setValueAtTime(0.12, t); gn.gain.setValueAtTime(0, t + 0.2); o.connect(gn).connect(out()); o.start(t); o.stop(t + 0.22); } }
function rumble() { if (!actx) return; const n = noise(5), f = actx.createBiquadFilter(), gn = actx.createGain(), t = actx.currentTime; f.type = 'bandpass'; f.frequency.value = 600; gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(0.25, t + 3); gn.gain.linearRampToValueAtTime(0.0001, t + 5); n.connect(f).connect(gn).connect(out()); n.start(t); }
function music() {
  const c = actx, start = c.currentTime + 0.05;
  const m = c.createGain(); m.gain.value = 0.3; m.connect(out());
  const bass = [55, 55, 43.65, 49, 55, 55, 41.2, 49];
  for (let bar = 0; bar < 15; bar++) {
    const t0 = start + bar * 2, loud = bar < 3 ? 0.35 : bar < 7 ? 0.7 : 1;
    // pulsing bass (eighth notes)
    for (let i = 0; i < 8; i++) { const tt = t0 + i * 0.25, o = c.createOscillator(), gn = c.createGain(), lp = c.createBiquadFilter(); o.type = 'sawtooth'; o.frequency.value = bass[bar % 8]; lp.type = 'lowpass'; lp.frequency.value = 400 + bar * 50; gn.gain.setValueAtTime(0.18 * loud, tt); gn.gain.exponentialRampToValueAtTime(0.001, tt + 0.22); o.connect(lp).connect(gn).connect(m); o.start(tt); o.stop(tt + 0.24); }
    // kick on every beat, from the "6 years" scene
    if (bar >= 1) for (let b = 0; b < 4; b++) { const tt = t0 + b * 0.5, o = c.createOscillator(), gn = c.createGain(); o.frequency.setValueAtTime(140, tt); o.frequency.exponentialRampToValueAtTime(40, tt + 0.2); gn.gain.setValueAtTime(0.7 * loud, tt); gn.gain.exponentialRampToValueAtTime(0.001, tt + 0.28); o.connect(gn).connect(m); o.start(tt); o.stop(tt + 0.3); }
    // tense high strings
    const f = [440, 349.2, 392, 329.6][bar % 4];
    for (const mult of [1, 1.5]) { const o = c.createOscillator(), gn = c.createGain(); o.type = 'triangle'; o.frequency.value = f * mult; gn.gain.setValueAtTime(0.0001, t0); gn.gain.linearRampToValueAtTime(0.05 * loud, t0 + 1); gn.gain.linearRampToValueAtTime(0.0001, t0 + 2); o.connect(gn).connect(m); o.start(t0); o.stop(t0 + 2.05); }
  }
  // music drops out for a beat before the title, then hits
  m.gain.setValueAtTime(0.3, start + 26.8); m.gain.linearRampToValueAtTime(0.02, start + 26.95); m.gain.setValueAtTime(0.35, start + 27);
  m.gain.setValueAtTime(0.35, start + DURATION - 1); m.gain.linearRampToValueAtTime(0.0001, start + DURATION);
}

let running = false;
function run(record) {
  if (running) return;
  running = true; lastScene = -1;
  const playBtn = document.getElementById('play'), recBtn = document.getElementById('rec'), status = document.getElementById('status');
  playBtn.disabled = recBtn.disabled = true;
  actx = actx ?? new (window.AudioContext || window.webkitAudioContext)();
  const dest = actx.createMediaStreamDestination();
  bus = actx.createGain(); bus.connect(dest); bus.connect(actx.destination);
  music();
  let recorder = null; const chunks = [];
  if (record) {
    const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
    const type = ['video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find((t) => MediaRecorder.isTypeSupported(t)) || '';
    recorder = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 10_000_000 });
    recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: recorder.mimeType });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'palasyo-tiktok.' + (recorder.mimeType.includes('mp4') ? 'mp4' : 'webm');
      a.click();
      status.textContent = 'Video saved to your downloads.';
    };
    recorder.start();
    status.textContent = 'Recording… keep this tab open and visible until it finishes.';
  }
  const t0 = performance.now();
  const frame = () => {
    const time = (performance.now() - t0) / 1000;
    draw(Math.min(time, DURATION - 0.01), true);
    if (time < DURATION) requestAnimationFrame(frame);
    else { running = false; playBtn.disabled = recBtn.disabled = false; if (recorder) recorder.stop(); }
  };
  frame();
}
document.getElementById('play').onclick = () => run(false);
document.getElementById('rec').onclick = () => run(true);
draw(1.8);
</script>
</body>
</html>
