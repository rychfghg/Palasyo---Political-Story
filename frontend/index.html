<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palasyo: A Political Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      #boot { position: fixed; inset: 0; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(circle at 50% 40%, #0d1824, #050b11 70%); color: #d6b25e; font-family: Georgia, serif; transition: opacity 0.4s; }
      #boot.is-done { opacity: 0; pointer-events: none; }
      #boot .seal { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(214, 178, 94, 0.3); border-top-color: #d6b25e; animation: boot-spin 1s linear infinite; }
      #boot b { font-size: 28px; letter-spacing: 0.08em; }
      #boot small { color: rgba(239, 230, 208, 0.6); font-family: system-ui, sans-serif; letter-spacing: 0.2em; text-transform: uppercase; font-size: 11px; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot" role="status"><div class="seal"></div><b>PALASYO</b><small>Opening the Palace doors…</small></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
